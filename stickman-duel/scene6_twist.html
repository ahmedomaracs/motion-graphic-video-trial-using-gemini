<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; width: 1920px; height: 1080px; }
  </style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import {
  clamp, lerp, easeOut, easeInOut, easeElastic,
  drawStickman, drawHeart, pseudoRandom
} from './common.js';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

window.film = {
  duration: 6.0,
  frame(t) {
    ctx.clearRect(0, 0, 1920, 1080);

    // 1. Peaceful sunset park returns
    const sky = ctx.createLinearGradient(0, 0, 0, 850);
    sky.addColorStop(0.0, '#251538');
    sky.addColorStop(0.5, '#73264d');
    sky.addColorStop(0.8, '#d45631');
    sky.addColorStop(1.0, '#f9a13a');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, 1920, 1080);

    // Ground
    ctx.fillStyle = '#1c1024';
    ctx.fillRect(0, 840, 1920, 240);

    // Smoking craters under Red and Blue
    ctx.fillStyle = '#120a17';
    ctx.beginPath();
    ctx.ellipse(450, 850, 90, 25, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(750, 850, 90, 25, 0, 0, Math.PI * 2);
    ctx.fill();

    // Lingering smoke wisps (t < 2.5s)
    if (t < 2.5) {
      const smokeAlpha = (1.0 - t / 2.5) * 0.4;
      ctx.fillStyle = `rgba(200, 180, 200, ${smokeAlpha})`;
      for (let s = 0; s < 10; s++) {
        const sx = 450 + (s < 5 ? 0 : 300) + pseudoRandom(s) * 60;
        const sy = 840 - ((t * 40 + pseudoRandom(s + 2) * 80) % 120);
        ctx.beginPath();
        ctx.arc(sx, sy, 12 + pseudoRandom(s + 3) * 15, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 2. Fallen Red Stickman (Knocked Out)
    let redHeadTilt = 0;
    let redEye = 'dizzy';
    let redSweat = false;
    let redArmAngle = [0.8, 0.4]; // trembling arm raising rose

    if (t >= 4.2) {
      // Raises head, looks at Blue in disbelief
      redHeadTilt = -0.3;
      redEye = 'shock';
      redSweat = true;
      redArmAngle = [0.2, 0.8]; // drops rose
    }

    ctx.save();
    ctx.translate(450, 840);
    // Flat on back horizontal
    ctx.rotate(Math.PI * 0.48);
    drawStickman(ctx, {
      x: 0,
      y: 0,
      scale: 1.0,
      color: '#ff3344',
      lineWidth: 8,
      eyeType: redEye,
      eyeDir: 1,
      headTilt: redHeadTilt,
      sweatdrop: redSweat,
      torsoAngle: 0,
      headband: { color: '#ff2233', flutter: 2 },
      leftArm: redArmAngle,
      rightArm: [-0.4, 0.6],
      leftLeg: [0.1, 0.2],
      rightLeg: [-0.2, 0.3],
      heldItemLeft: { type: 'rose' }
    });
    ctx.restore();

    // 3. Fallen Blue Stickman (Knocked Out)
    let blueHeadTilt = 0;
    let blueEye = 'dizzy';
    let blueSweat = false;
    let blueArmAngle = [-0.8, -0.4];

    if (t >= 4.2) {
      blueHeadTilt = 0.3;
      blueEye = 'shock';
      blueSweat = true;
      blueArmAngle = [-0.2, -0.8];
    }

    ctx.save();
    ctx.translate(750, 840);
    ctx.rotate(-Math.PI * 0.48);
    drawStickman(ctx, {
      x: 0,
      y: 0,
      scale: 1.0,
      color: '#00bbff',
      lineWidth: 8,
      eyeType: blueEye,
      eyeDir: -1,
      headTilt: blueHeadTilt,
      sweatdrop: blueSweat,
      torsoAngle: 0,
      scarf: { color: '#0099ee', flutter: 2 },
      leftArm: blueArmAngle,
      rightArm: [0.4, -0.6],
      leftLeg: [-0.1, -0.2],
      rightLeg: [0.2, -0.3],
      heldItemLeft: { type: 'ring' }
    });
    ctx.restore();

    // Comic groaning dialogue
    if (t < 3.5) {
      ctx.save();
      ctx.fillStyle = '#ff8899';
      ctx.font = '700 20px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('...pick me...', 450, 750);
      ctx.fillStyle = '#88ccff';
      ctx.fillText('...no... me...', 750, 750);
      ctx.restore();
    }

    // 4. Green Stickman & Woman Progression
    let greenX = 2050;
    let womanX = 1100;
    let womanEye = 'normal';
    let womanLArm = [0.3, -0.4];
    let womanRArm = [-0.3, 0.4];

    if (t >= 1.5 && t < 3.2) {
      // Green walks in with cool swagger
      const gProgress = (t - 1.5) / 1.7;
      greenX = lerp(2050, 1300, easeOut(gProgress));
      
      // Woman sees Green, heart eyes pop!
      womanEye = 'love';
      womanLArm = [0.8, -0.8];
      womanRArm = [-0.2, 0.4];

      // Hearts pop above woman
      const heartAnim = (t * 4) % 1.0;
      ctx.fillStyle = '#ff1155';
      drawHeart(ctx, 1100, 700 - heartAnim * 40, 16);
    } else if (t >= 3.2) {
      // Woman and Green stroll off happily together to the right
      const exitProgress = (t - 3.2) / 2.8;
      greenX = lerp(1300, 1750, exitProgress);
      womanX = lerp(1100, 1630, exitProgress);
      womanEye = 'happy';

      // Linked arms walking
      const walkCycle = t * 8;
      womanLArm = [0.4, 0.8];
      womanRArm = [-0.4, 0.2];
    }

    // Draw Woman
    drawStickman(ctx, {
      x: womanX,
      y: 840,
      scale: 1.0,
      color: '#ffffff',
      lineWidth: 7,
      eyeType: womanEye,
      eyeDir: 1, // looking at green
      hairBow: { color: '#ff3377' },
      skirt: { color: '#ff66aa' },
      leftArm: womanLArm,
      rightArm: womanRArm,
      leftLeg: [Math.sin(t * 8) * 0.3, 0.2],
      rightLeg: [-Math.sin(t * 8) * 0.3, 0.2]
    });

    // Draw Cool Green Stickman
    if (t >= 1.5) {
      const gHeadBob = Math.sin(t * 6) * 0.08;
      drawStickman(ctx, {
        x: greenX,
        y: 840,
        scale: 1.05,
        color: '#22cc66',
        lineWidth: 8,
        eyeType: 'happy',
        eyeDir: -1,
        headTilt: gHeadBob,
        sunglasses: true,
        headphones: true,
        leftArm: [-0.6, 1.2], // holding boba tea
        rightArm: [0.6, 1.2],  // holding second boba tea
        leftLeg: [-Math.sin(t * 8) * 0.3, 0.2],
        rightLeg: [Math.sin(t * 8) * 0.3, 0.2],
        heldItemLeft: { type: 'drink' },
        heldItemRight: t < 3.2 ? { type: 'drink' } : null
      });

      // Music notes floating from headphones
      ctx.fillStyle = '#ffff44';
      ctx.font = '26px Arial, sans-serif';
      const noteT = (t * 2) % 1.0;
      ctx.fillText('♪', greenX - 25, 710 - noteT * 40);
      ctx.fillText('♫', greenX + 25, 720 - noteT * 40);
    }

    // 5. Grand FIN / THE END Banner (t >= 4.5s)
    if (t >= 4.5) {
      const finProgress = clamp((t - 4.5) / 0.8, 0, 1);
      const finY = lerp(-120, 240, easeElastic(finProgress));

      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
      ctx.fillRect(0, finY - 80, 1920, 160);

      ctx.fillStyle = '#ffcc00';
      ctx.font = '900 80px Impact, Arial Black, sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff2255';
      ctx.shadowBlur = 25;
      ctx.fillText('FIN', 960, finY + 10);

      ctx.font = '700 28px Arial, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 0;
      ctx.fillText('Sometimes, it is better to just grab bubble tea.', 960, finY + 50);
      ctx.restore();
    }
  }
};
</script>
</body>
</html>
