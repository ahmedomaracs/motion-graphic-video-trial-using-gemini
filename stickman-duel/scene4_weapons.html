<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; width: 1920px; height: 1080px; }
  </style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import {
  clamp, lerp, easeOut, easeInOut, easeIn,
  drawStickman, drawImpactBurst, drawSpeedLines, pseudoRandom
} from './common.js';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

window.film = {
  duration: 5.0,
  frame(t) {
    ctx.clearRect(0, 0, 1920, 1080);

    // Screen Shake on weapon impacts
    let shake = 0;
    const clashes = [1.8, 2.6, 3.4, 4.2];
    for (const c of clashes) {
      if (t >= c && t < c + 0.3) {
        shake = (1.0 - (t - c) / 0.3) * 18;
      }
    }
    const sx = (pseudoRandom(t * 70) - 0.5) * shake;
    const sy = (pseudoRandom(t * 70 + 1) - 0.5) * shake;

    ctx.save();
    ctx.translate(sx, sy);

    // 1. Dark dramatic anime night arena
    const bg = ctx.createLinearGradient(0, 0, 0, 1080);
    bg.addColorStop(0, '#0a0512');
    bg.addColorStop(0.5, '#1b0d2b');
    bg.addColorStop(1, '#080310');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, 1920, 1080);

    // Giant glowing full moon in background
    ctx.save();
    const moonGrad = ctx.createRadialGradient(960, 400, 20, 960, 400, 220);
    moonGrad.addColorStop(0, 'rgba(255, 255, 230, 0.95)');
    moonGrad.addColorStop(0.5, 'rgba(230, 240, 255, 0.4)');
    moonGrad.addColorStop(1, 'rgba(200, 220, 255, 0)');
    ctx.fillStyle = moonGrad;
    ctx.beginPath();
    ctx.arc(960, 400, 220, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Floor
    ctx.fillStyle = '#0f0a17';
    ctx.fillRect(0, 840, 1920, 240);
    ctx.strokeStyle = '#331a47';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, 840);
    ctx.lineTo(1920, 840);
    ctx.stroke();

    // 2. Weapon Summoning & Fighting
    if (t < 1.5) {
      // Summoning Weapons
      const summonProgress = t / 1.5;

      // Red draws Flaming Katana
      drawStickman(ctx, {
        x: 600,
        y: 840,
        scale: 1.2,
        color: '#ff3344',
        lineWidth: 8,
        eyeType: 'angry',
        eyeDir: 1,
        torsoAngle: 0.15,
        headband: { color: '#ff2233', flutter: Math.sin(t * 20) * 12 },
        leftArm: [1.2, -0.4], // wielding blade up
        rightArm: [-0.6, 0.8],
        leftLeg: [0.4, -0.3],
        rightLeg: [-0.4, 0.4],
        heldItemLeft: {
          type: 'sword',
          length: lerp(20, 120, summonProgress),
          glowColor: '#ff2200',
          edgeColor: '#ff8800'
        }
      });

      // Blue manifests Lightning Staff
      drawStickman(ctx, {
        x: 1320,
        y: 840,
        scale: 1.2,
        color: '#00bbff',
        lineWidth: 8,
        eyeType: 'angry',
        eyeDir: -1,
        torsoAngle: -0.15,
        scarf: { color: '#0099ee', flutter: Math.sin(t * 20) * 12 },
        leftArm: [-1.2, -0.4],
        rightArm: [0.6, 0.8],
        leftLeg: [-0.4, 0.3],
        rightLeg: [0.4, -0.3],
        heldItemLeft: {
          type: 'staff',
          length: lerp(20, 160, summonProgress),
          glowColor: '#00f0ff'
        }
      });
    } else if (t < 3.5) {
      // Mid-Air Aerial Clash!
      const clashProgress = (t - 1.5) / 2.0;
      
      // Speed lines during mid-air jump
      drawSpeedLines(ctx, 960, 540, 0.8, t * 15);

      // Red jumps from 600 to 880, y from 840 to 520
      const jumpY = 840 - Math.sin(clashProgress * Math.PI) * 360;
      const redJumpX = lerp(600, 870, easeOut(Math.min(1.0, clashProgress * 1.5)));

      drawStickman(ctx, {
        x: redJumpX,
        y: jumpY,
        scale: 1.2,
        color: '#ff3344',
        lineWidth: 8,
        eyeType: 'angry',
        eyeDir: 1,
        torsoAngle: 0.5, // diving forward slash
        headband: { color: '#ff2233', flutter: 25 },
        leftArm: [1.6, -0.2], // downward blade slash
        rightArm: [-0.8, 0.8],
        leftLeg: [0.8, 0.4],
        rightLeg: [-0.6, 0.6],
        heldItemLeft: { type: 'sword', length: 120, glowColor: '#ff2200', edgeColor: '#ff8800' }
      });

      // Blue jumps from 1320 to 1050, y from 840 to 520
      const blueJumpX = lerp(1320, 1050, easeOut(Math.min(1.0, clashProgress * 1.5)));

      drawStickman(ctx, {
        x: blueJumpX,
        y: jumpY,
        scale: 1.2,
        color: '#00bbff',
        lineWidth: 8,
        eyeType: 'angry',
        eyeDir: -1,
        torsoAngle: -0.5, // upward staff block
        scarf: { color: '#0099ee', flutter: 25 },
        leftArm: [-1.6, -0.2], // horizontal staff guard
        rightArm: [0.8, 0.8],
        leftLeg: [-0.8, 0.4],
        rightLeg: [0.6, 0.6],
        heldItemLeft: { type: 'staff', length: 160, glowColor: '#00f0ff' }
      });

      // Clashing Sparks at center (x=960, y=520)
      if (t >= 1.8) {
        ctx.save();
        ctx.shadowColor = '#ffff00';
        ctx.shadowBlur = 25;
        // Sparks spray
        for (let sp = 0; sp < 35; sp++) {
          const spAngle = pseudoRandom(sp + t * 30) * Math.PI * 2;
          const spDist = pseudoRandom(sp * 3 + t * 30) * 160;
          const spX = 960 + Math.cos(spAngle) * spDist;
          const spY = 520 + Math.sin(spAngle) * spDist;
          ctx.fillStyle = sp % 2 === 0 ? '#ffea00' : '#ffffff';
          ctx.beginPath();
          ctx.arc(spX, spY, 3 + pseudoRandom(sp) * 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Comic Starburst
        drawImpactBurst(ctx, 960, 520, 75, 'CLANG!!', '#ffff00');
      }
    } else {
      // Rapid Weapon Exchanges on Ground & Push Back
      const p3 = (t - 3.5) / 1.5;
      const redX = lerp(850, 520, easeOut(p3));
      const blueX = lerp(1070, 1400, easeOut(p3));

      drawStickman(ctx, {
        x: redX,
        y: 840,
        scale: 1.2,
        color: '#ff3344',
        lineWidth: 8,
        eyeType: 'angry',
        eyeDir: 1,
        torsoAngle: 0.2,
        headband: { color: '#ff2233', flutter: 18 },
        leftArm: [1.3, -0.3],
        rightArm: [-0.6, 0.8],
        leftLeg: [0.5, -0.3],
        rightLeg: [-0.6, 0.5],
        heldItemLeft: { type: 'sword', length: 120, glowColor: '#ff2200', edgeColor: '#ff8800' }
      });

      drawStickman(ctx, {
        x: blueX,
        y: 840,
        scale: 1.2,
        color: '#00bbff',
        lineWidth: 8,
        eyeType: 'angry',
        eyeDir: -1,
        torsoAngle: -0.2,
        scarf: { color: '#0099ee', flutter: 18 },
        leftArm: [-1.3, -0.3],
        rightArm: [0.6, 0.8],
        leftLeg: [-0.5, 0.3],
        rightLeg: [0.6, -0.5],
        heldItemLeft: { type: 'staff', length: 160, glowColor: '#00f0ff' }
      });

      // Residual sparks along ground
      ctx.fillStyle = '#ffaa00';
      for (let s = 0; s < 12; s++) {
        const sx = lerp(redX, blueX, s / 12) + (pseudoRandom(s + t * 10) - 0.5) * 40;
        const sy = 835 - pseudoRandom(s) * 20;
        ctx.beginPath();
        ctx.arc(sx, sy, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.restore();
  }
};
</script>
</body>
</html>
