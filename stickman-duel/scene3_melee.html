<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; width: 1920px; height: 1080px; }
  </style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import {
  clamp, lerp, easeOut, easeInOut, easeIn,
  drawStickman, drawImpactBurst, drawSpeedLines, pseudoRandom
} from './common.js';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

window.film = {
  duration: 6.0,
  frame(t) {
    ctx.clearRect(0, 0, 1920, 1080);

    // Screen Shake based on impact moments
    let shake = 0;
    const impacts = [0.4, 0.8, 1.2, 1.6, 2.8, 3.4, 4.6];
    for (const imp of impacts) {
      if (t >= imp && t < imp + 0.25) {
        shake = (1.0 - (t - imp) / 0.25) * 16;
      }
    }
    const sx = (pseudoRandom(t * 80) - 0.5) * shake;
    const sy = (pseudoRandom(t * 80 + 1) - 0.5) * shake;

    ctx.save();
    ctx.translate(sx, sy);

    // 1. Arena Background
    const bg = ctx.createLinearGradient(0, 0, 0, 850);
    bg.addColorStop(0, '#10081d');
    bg.addColorStop(0.6, '#281335');
    bg.addColorStop(1, '#451e36');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, 1920, 1080);

    // Arena Floor
    ctx.fillStyle = '#18121f';
    ctx.fillRect(0, 840, 1920, 240);
    ctx.strokeStyle = '#4a2540';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, 840);
    ctx.lineTo(1920, 840);
    ctx.stroke();

    // 2. Woman watching in background right
    const womanSway = Math.sin(t * 8) * 0.05;
    drawStickman(ctx, {
      x: 1720,
      y: 840,
      scale: 0.9,
      color: '#ffffff',
      lineWidth: 6,
      eyeType: 'shock',
      eyeDir: -1,
      torsoAngle: womanSway,
      hairBow: { color: '#ff3377' },
      skirt: { color: '#ff66aa' },
      leftArm: [0.6, -1.2],  // hands on cheeks in shock
      rightArm: [-0.6, 1.2],
      leftLeg: [0, 0],
      rightLeg: [0, 0]
    });

    // Comic speech bubble for woman
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(1720, 640, 55, 30, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(1720, 670);
    ctx.lineTo(1705, 695);
    ctx.lineTo(1735, 670);
    ctx.fill();
    ctx.fillStyle = '#000000';
    ctx.font = '900 24px Arial Black, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('OMG!!', 1720, 648);
    ctx.restore();

    // 3. Fighting Logic & Choreography
    if (t < 2.0) {
      // PHASE 1: Rapid Punch Barrage! Red attacks, Blue parries!
      const punchFreq = 16;
      const punchCycle = (t * punchFreq) % 1.0;
      const punchSide = Math.sin(t * punchFreq * Math.PI) > 0 ? 1 : -1;

      // Red dashes forward at x=780
      drawStickman(ctx, {
        x: 780 + Math.sin(t * punchFreq * Math.PI) * 15,
        y: 840,
        scale: 1.1,
        color: '#ff3344',
        lineWidth: 8,
        eyeType: 'angry',
        eyeDir: 1,
        torsoAngle: 0.35,
        headband: { color: '#ff2233', flutter: Math.sin(t * 30) * 18 },
        leftArm: punchSide > 0 ? [1.5, 0.1] : [-0.3, 1.2], // rapid punch thrust
        rightArm: punchSide > 0 ? [-0.3, 1.2] : [1.5, 0.1],
        leftLeg: [0.6, -0.4],
        rightLeg: [-0.5, 0.5],
      });

      // Ghost punch afterimages
      for (let g = 1; g <= 3; g++) {
        ctx.save();
        ctx.strokeStyle = `rgba(255, 50, 70, ${0.4 - g * 0.1})`;
        ctx.lineWidth = 6;
        ctx.beginPath();
        const gy = 760 + (pseudoRandom(t * 20 + g) - 0.5) * 80;
        ctx.moveTo(820, gy);
        ctx.lineTo(940 + pseudoRandom(t * 25 + g) * 50, gy);
        ctx.stroke();
        ctx.restore();
      }

      // Blue parries at x=1020
      drawStickman(ctx, {
        x: 1020,
        y: 840,
        scale: 1.1,
        color: '#00bbff',
        lineWidth: 8,
        eyeType: 'angry',
        eyeDir: -1,
        torsoAngle: -0.25,
        scarf: { color: '#0099ee', flutter: Math.sin(t * 25) * 16 },
        leftArm: [-1.2, -0.8], // rapid parry hands
        rightArm: [-0.8, -1.2],
        leftLeg: [-0.4, 0.3],
        rightLeg: [0.5, -0.4],
      });

      // Impact starbursts between them (x=960, y=750)
      for (const imp of [0.4, 0.8, 1.2, 1.6]) {
        if (t >= imp && t < imp + 0.2) {
          const hitRadius = Math.max(1, (1.0 - (t - imp) / 0.2) * 50);
          const hitText = imp === 0.4 ? 'BAM!' : (imp === 0.8 ? 'POW!' : (imp === 1.2 ? 'WHAM!' : 'CLASH!'));
          drawImpactBurst(ctx, 960 + (pseudoRandom(imp) - 0.5) * 60, 750 + (pseudoRandom(imp * 2) - 0.5) * 50, hitRadius, hitText);
        }
      }
    } else if (t < 3.8) {
      // PHASE 2: Blue Counter-Kick & Red Skids back!
      const p2 = (t - 2.0) / 1.8;

      if (p2 < 0.45) {
        // Blue leaps into flying spin kick!
        const kickT = p2 / 0.45;
        const blueKickX = lerp(1020, 920, kickT);
        const blueKickY = 840 - Math.sin(kickT * Math.PI) * 160;
        
        drawStickman(ctx, {
          x: blueKickX,
          y: blueKickY,
          scale: 1.1,
          color: '#00bbff',
          lineWidth: 8,
          eyeType: 'angry',
          eyeDir: -1,
          torsoAngle: -0.8, // horizontal kick angle
          scarf: { color: '#0099ee', flutter: Math.sin(t * 30) * 20 },
          leftLeg: [-1.5, 0.1], // extended thrust kick
          rightLeg: [0.8, 1.2],  // tucked leg
          leftArm: [0.8, 0.5],
          rightArm: [-0.8, 0.5],
        });

        // Red blocks at impact (x=800)
        drawStickman(ctx, {
          x: 780,
          y: 840,
          scale: 1.1,
          color: '#ff3344',
          lineWidth: 8,
          eyeType: 'angry',
          eyeDir: 1,
          torsoAngle: 0.1,
          headband: { color: '#ff2233', flutter: 10 },
          leftArm: [1.2, 1.4], // crossed forearm guard
          rightArm: [1.1, 1.4],
          leftLeg: [0.4, 0.2],
          rightLeg: [-0.6, 0.5],
        });

        if (p2 >= 0.35) {
          drawImpactBurst(ctx, 830, 760, 65, 'BLOCK!!', '#00f0ff');
        }
      } else {
        // Red skids backward from 780 to 450!
        const skidT = (p2 - 0.45) / 0.55;
        const redSkidX = lerp(780, 450, easeOut(skidT));

        drawStickman(ctx, {
          x: redSkidX,
          y: 840,
          scale: 1.1,
          color: '#ff3344',
          lineWidth: 8,
          eyeType: 'angry',
          eyeDir: 1,
          torsoAngle: -0.4, // pushed back
          headband: { color: '#ff2233', flutter: Math.sin(t * 20) * 15 },
          leftArm: [1.1, 1.2],
          rightArm: [0.9, 1.2],
          leftLeg: [0.8, 0.1],  // bracing front heel
          rightLeg: [-0.8, 0.6], // dragging back foot
        });

        // Dust / smoke trail on ground
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        for (let d = 0; d < 8; d++) {
          const dx = lerp(780, redSkidX, d / 8) + pseudoRandom(d) * 30;
          const dy = 840 - pseudoRandom(d + 1) * 20;
          ctx.beginPath();
          ctx.arc(dx, dy, 8 + pseudoRandom(d) * 14, 0, Math.PI * 2);
          ctx.fill();
        }

        // Blue lands smoothly at x=1050
        drawStickman(ctx, {
          x: 1050,
          y: 840,
          scale: 1.1,
          color: '#00bbff',
          lineWidth: 8,
          eyeType: 'angry',
          eyeDir: -1,
          torsoAngle: 0.15,
          scarf: { color: '#0099ee', flutter: 8 },
          leftArm: [-0.8, 0.6],
          rightArm: [0.6, -0.8],
          leftLeg: [-0.4, 0.3],
          rightLeg: [0.4, -0.3],
        });
      }
    } else {
      // PHASE 3: Red Acrobatic Aerial Somersault & Flying Knee!
      const p3 = (t - 3.8) / 2.2;
      
      if (p3 < 0.6) {
        // Red backflips high into the air!
        const flipT = p3 / 0.6;
        const flipX = lerp(450, 750, flipT);
        const flipY = 840 - Math.sin(flipT * Math.PI) * 320;
        const flipRot = flipT * Math.PI * 2;

        ctx.save();
        ctx.translate(flipX, flipY);
        ctx.rotate(flipRot);
        drawStickman(ctx, {
          x: 0,
          y: 0,
          scale: 1.1,
          color: '#ff3344',
          lineWidth: 8,
          eyeType: 'angry',
          eyeDir: 1,
          torsoAngle: 0,
          headband: { color: '#ff2233', flutter: 20 },
          leftArm: [1.2, 0.8],
          rightArm: [1.2, 0.8],
          leftLeg: [1.0, 1.2], // tucked in ball
          rightLeg: [1.0, 1.2],
        });
        ctx.restore();

        // Blue tracks Red in mid-air
        drawStickman(ctx, {
          x: 1050,
          y: 840,
          scale: 1.1,
          color: '#00bbff',
          lineWidth: 8,
          eyeType: 'angry',
          eyeDir: -1,
          torsoAngle: -0.3,
          headTilt: -0.4, // looking up
          scarf: { color: '#0099ee', flutter: 10 },
          leftArm: [-1.0, -0.6],
          rightArm: [0.6, 0.6],
          leftLeg: [-0.3, 0.2],
          rightLeg: [0.3, -0.2],
        });
      } else {
        // Both land, facing off in deep martial poses!
        drawStickman(ctx, {
          x: 750,
          y: 840,
          scale: 1.1,
          color: '#ff3344',
          lineWidth: 8,
          eyeType: 'angry',
          eyeDir: 1,
          torsoAngle: 0.3,
          headband: { color: '#ff2233', flutter: 12 },
          leftArm: [1.0, 0.5],
          rightArm: [-0.7, 1.2],
          leftLeg: [0.5, -0.5],
          rightLeg: [-0.6, 0.4],
        });

        drawStickman(ctx, {
          x: 1100,
          y: 840,
          scale: 1.1,
          color: '#00bbff',
          lineWidth: 8,
          eyeType: 'angry',
          eyeDir: -1,
          torsoAngle: -0.3,
          scarf: { color: '#0099ee', flutter: 12 },
          leftArm: [-1.0, 0.5],
          rightArm: [0.7, 1.2],
          leftLeg: [-0.5, 0.5],
          rightLeg: [0.6, -0.4],
        });
      }
    }

    ctx.restore();
  }
};
</script>
</body>
</html>
